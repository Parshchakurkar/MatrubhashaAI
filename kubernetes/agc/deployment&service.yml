apiVersion: v1
kind: Namespace
metadata:
  name: tomcat-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat
  namespace: tomcat-app
  labels:
    app: tomcat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tomcat
  template:
    metadata:
      labels:
        app: tomcat
    spec:
      containers:
        - name: tomcat
          image: matrubhashaaiacr.azurecr.io/tomcat:1.0
          # The official image ships with an empty webapps folder (404 on /).
          # Copy the default apps so the welcome page responds.
          command: ["/bin/sh", "-c"]
          args:
            - cp -r /usr/local/tomcat/webapps.dist/* /usr/local/tomcat/webapps/ && exec catalina.sh run
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat
  namespace: tomcat-app
  labels:
    app: tomcat
spec:
  type: ClusterIP
  selector:
    app: tomcat
  ports:
    - name: http
      port: 80
      targetPort: http
